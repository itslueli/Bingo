services:
  - type: web
    name: bingo-friends-api
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run db:generate && npm run build -w @bingo/shared && npm run build -w @bingo/server
    startCommand: npm run db:deploy && npm run start -w @bingo/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.15.0
      - key: DATABASE_URL
        fromDatabase:
          name: bingo-friends-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: TOKEN_PEPPER
        generateValue: true
      - key: ROOM_TTL_HOURS
        value: 24

databases:
  - name: bingo-friends-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: bingo_friends
    user: bingo
    ipAllowList: []
